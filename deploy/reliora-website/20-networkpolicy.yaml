# The website pods: ingress on 8080 only, no egress at all. A static site needs
# none, so a commit's nginx config cannot reach the cluster or the LAN.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: site-web
  namespace: reliora-website
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: reliora-website}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}]
  egress: []
---
# The deployer pod. Kubernetes cannot narrow this per container, so the check
# step (commit code) shares it; that step holds no secret to send.
#   - DNS; the API server (Service IP and the node address it is DNAT-ed to);
#   - the website pods on 8080 (per-pod smoke test);
#   - GitHub's published git ranges on SSH (the deploy key);
#   - HTTPS to public addresses only (the Slack webhook has no fixed address).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: site-deployer
  namespace: reliora-website
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: site-deployer}
  policyTypes: [Ingress, Egress]
  ingress: []
