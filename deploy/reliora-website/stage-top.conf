# Top-level nginx config for the deployer's stage test (step 3b). Everything
# nginx writes goes to /stagetmp; the release volume is mounted read-only, as in
# the live pods. __RELEASE__ is replaced with the release directory.
worker_processes 1;
error_log /stagetmp/error.log warn;
pid /stagetmp/nginx.pid;
events { worker_connections 64; }
http {
    client_body_temp_path /stagetmp/client_temp;
    proxy_temp_path /stagetmp/proxy_temp;
    fastcgi_temp_path /stagetmp/fastcgi_temp;
    uwsgi_temp_path /stagetmp/uwsgi_temp;
    scgi_temp_path /stagetmp/scgi_temp;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    include __RELEASE__/staging.conf;
}
