# Apply in two parts (cutover in doc/plans/2026-11-02-reliora-site-deployer.md):
#   kubectl apply -k deploy/reliora-website            # everything except the website
#   kubectl apply -f deploy/reliora-website/50-website.yaml   # cutover step 5 only
namespace: reliora-website
resources:
  - 00-storage.yaml
  - 10-rbac.yaml
  - 20-networkpolicy.yaml
  - 30-externalsecrets.yaml
  - 40-cronjob.yaml
configMapGenerator:
  - name: site-deployer-scripts
    files: [deployer.sh, smoke.sh, stage-top.conf, known_hosts]
generatorOptions:
  disableNameSuffixHash: true
