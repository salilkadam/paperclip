# Written to Vault once by the owner (the ops role cannot write new paths):
#   vault kv put secret/t6-apps/reliora-website/deployer deploy_key=@id_ed25519 slack_webhook=<url>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: site-deployer-git
  namespace: reliora-website
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target: {name: site-deployer-git, creationPolicy: Owner}
  data:
    - secretKey: deploy_key
      remoteRef: {key: t6-apps/reliora-website/deployer, property: deploy_key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: site-deployer-slack
  namespace: reliora-website
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target: {name: site-deployer-slack, creationPolicy: Owner}
  data:
    - secretKey: webhook
      remoteRef: {key: t6-apps/reliora-website/deployer, property: slack_webhook}
