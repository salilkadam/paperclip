# The deployer. Each step is an initContainer, so they run in order; each holds
# only the mounts in the plan's table. Every step exits 0 and records its
# outcome; the main container (report) sets the Job's exit code.
# Each command is `sh -c 'timeout -s KILL N ...; exit $?'`: BusyBox timeout as
# PID 1 (or with the script as PID 1) bounds nothing, because PID 1 ignores the
# signal; this shape was verified to kill on time.
# Plan: doc/plans/2026-11-02-reliora-site-deployer.md
apiVersion: batch/v1
kind: CronJob
metadata:
  name: site-deployer
  namespace: reliora-website
  labels: {app.kubernetes.io/component: site-deployer}
spec:
  schedule: "*/2 * * * *"
  suspend: true            # unsuspended at cutover step 6
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app.kubernetes.io/component: site-deployer}
        spec:
          restartPolicy: Never
          serviceAccountName: site-deployer
          automountServiceAccountToken: false
          shareProcessNamespace: false
          enableServiceLinks: false
          securityContext: {runAsUser: 101, runAsGroup: 101, fsGroup: 101, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions: [{key: kubernetes.io/hostname, operator: NotIn, values: [cp1]}]
          initContainers:
            - name: lock
              image: alpine/k8s:1.33.4@sha256:b0523f0a244ddc4c8e055aa335c040d3d78b3ead5528f4544395f7f9f69c7b68
              command: [sh, -c, 'timeout -s KILL 60 sh /scripts/deployer.sh lock; exit $?']
              env: &env
                - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
                - {name: NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: sa-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
                - {name: trusted, mountPath: /trusted}
              securityContext: &csc {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              resources: &small {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
            - name: fetch
              image: alpine/git:2.47.2@sha256:062a01ad7a0eb17cff382bc5e26086b4d710e56dfdfdf001109a49b6d9bd378c
              command: [sh, -c, 'timeout -s KILL 180 sh /scripts/deployer.sh fetch; exit $?']
              env: *env
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: git-key, mountPath: /git-key, readOnly: true}
                - {name: releases, mountPath: /srv/site, readOnly: true}
                - {name: trusted, mountPath: /trusted}
                - {name: checkin, mountPath: /checkin}
              # ssh refuses to run as a uid with no passwd entry; 65534 (nobody)
              # exists in this image. Group 101 (fsGroup) reads the key.
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, runAsUser: 65534, runAsGroup: 101}
              resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: "1", memory: 512Mi}}
            - name: attempt
              image: alpine/k8s:1.33.4@sha256:b0523f0a244ddc4c8e055aa335c040d3d78b3ead5528f4544395f7f9f69c7b68
              command: [sh, -c, 'timeout -s KILL 60 sh /scripts/deployer.sh attempt; exit $?']
              env: *env
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: sa-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
                - {name: trusted, mountPath: /trusted}
                - {name: checkin, mountPath: /checkin}    # removed when attempts are exceeded
              securityContext: *csc
              resources: *small
            # commit code: no secret, no token, no release volume
            - name: check
              image: node:24-alpine@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85
              command: [sh, -c, 'timeout -s KILL 330 sh /scripts/deployer.sh check; exit $?']
              env: [{name: HOME, value: /tmp}]
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: checkin, mountPath: /checkin}
                - {name: checkout, mountPath: /checkout}
              securityContext: *csc
              resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 1Gi}}
            - name: copy
              image: nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:56b8272e43a0525f67aed68d1e0794a712d10e3e45a563e118e9a77c817e6f86
              command: [sh, -c, 'timeout -s KILL 150 sh /scripts/deployer.sh copy; exit $?']
              env: *env
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: releases, mountPath: /srv/site}
                - {name: trusted, mountPath: /trusted}
                - {name: checkout, mountPath: /checkout, readOnly: true}
              securityContext: *csc
              resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: "1", memory: 256Mi}}
            # the commit's nginx config: release volume read-only, writes only to stagetmp
            - name: stage
              image: nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:56b8272e43a0525f67aed68d1e0794a712d10e3e45a563e118e9a77c817e6f86
              command: [sh, -c, 'timeout -s KILL 270 sh /scripts/deployer.sh stage; exit $?']
              env: *env
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: releases, mountPath: /srv/site, readOnly: true}
                - {name: trusted, mountPath: /trusted, readOnly: true}
                - {name: stagetmp, mountPath: /stagetmp}
                - {name: stageout, mountPath: /stageout}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
              resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: "1", memory: 256Mi}}
            - name: switch
              image: alpine/k8s:1.33.4@sha256:b0523f0a244ddc4c8e055aa335c040d3d78b3ead5528f4544395f7f9f69c7b68
              command: [sh, -c, 'timeout -s KILL 780 sh /scripts/deployer.sh switch; exit $?']
              env: *env
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: sa-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
                - {name: releases, mountPath: /srv/site}
                - {name: trusted, mountPath: /trusted}
                - {name: stageout, mountPath: /stageout, readOnly: true}
              securityContext: *csc
              resources: *small
          containers:
            - name: report
              image: alpine/k8s:1.33.4@sha256:b0523f0a244ddc4c8e055aa335c040d3d78b3ead5528f4544395f7f9f69c7b68
              command: [sh, -c, 'timeout -s KILL 90 sh /scripts/deployer.sh report; exit $?']
              env: *env
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: sa-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
                - {name: trusted, mountPath: /trusted, readOnly: true}
                - {name: slack, mountPath: /slack, readOnly: true}
              securityContext: *csc
              resources: *small
          volumes:
            - {name: scripts, configMap: {name: site-deployer-scripts}}
            - name: sa-token
              projected:
                sources:
                  - serviceAccountToken: {path: token, expirationSeconds: 3600}
                  - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
                  - downwardAPI: {items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]}
            - {name: git-key, secret: {secretName: site-deployer-git, defaultMode: 0440}}
            - {name: slack, secret: {secretName: site-deployer-slack, defaultMode: 0440}}   # required: no silent alerts
            - {name: releases, persistentVolumeClaim: {claimName: site-releases}}
            - {name: trusted, emptyDir: {sizeLimit: 600Mi}}
            - {name: checkin, emptyDir: {sizeLimit: 600Mi}}
            - {name: checkout, emptyDir: {sizeLimit: 1Mi}}
            - {name: stagetmp, emptyDir: {sizeLimit: 64Mi}}
            - {name: stageout, emptyDir: {sizeLimit: 1Mi}}
