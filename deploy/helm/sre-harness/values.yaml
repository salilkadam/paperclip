# Default configuration for the external SRE harness.

# Namespace the harness pod runs in. It MUST be the Paperclip namespace:
# the sre-harness-sa ServiceAccount lives there and a pod can only use a
# ServiceAccount from its own namespace. Isolation comes from separate
# workloads, labels, and its own PVC, and the RBAC matrix grants this SA
# rights in bionicorg plus the three website/demo namespaces.
namespace: bionicorg

image:
  # Pinned dsh harness image. Do NOT use a floating tag: the harness must
  # not change silently. Cut a new tag per reviewed upgrade.
  # Built from deploy/harness-image/Dockerfile (npm @deepseek-ai/dsh pinned).
  repository: docker4zerocool/dsh
  tag: "0.2.0-rc.2-b1"
  pullPolicy: IfNotPresent
  # The dsh repo is private (same Docker Hub account as the bionic image);
  # the secret is created by the bionic-org deploy in the target namespace.
  pullSecrets:
    - dockerhub-pull-secret

# dsh web gateway. Upstream refuses to bind 0.0.0.0 on purpose (the UI can
# execute code), so dsh listens on loopback inside the pod. Operators reach
# it with:
#   kubectl -n bionicorg port-forward deploy/sre-harness 3080:3080
# because kubectl port-forward dials the pod's localhost. The ClusterIP
# Service is a naming convenience for port-forward; it cannot reach the UI.
ui:
  host: "127.0.0.1"
  port: 3080

serviceAccount:
  # Name of the pre-provisioned RBAC ServiceAccount (deploy/rbac/sre-harness.yaml).
  # The chart does NOT create RBAC; it only consumes the existing SA.
  name: sre-harness-sa

# Vault-backed credentials for the harness, via External Secrets Operator.
vault:
  enabled: true
  secretStoreKind: ClusterSecretStore
  secretStore: vault-backend
  refreshInterval: "1h"
  # Config secret holding the harness credentials. The chart syncs selected
  # properties; verify property names against Vault before first install.
  configPath: t6-apps/bionic-org/config
  configKeys:
    # secretKey in the synced K8s secret -> property name in Vault.
    # Verified against Vault 2026-10-16/17: this config path holds
    # sr_eng_agent_pat and deepseek_api_key but no SSH key. Git goes over
    # HTTPS with the PAT; add an ssh-key entry only once the property is
    # actually provisioned in Vault.
    - secretKey: GIT_PAT
      property: sr_eng_agent_pat
      optional: false
    - secretKey: DEEPSEEK_API_KEY
      property: deepseek_api_key
      optional: false
  # Slack notification target. The srenix/slack Vault path holds incoming
  # webhook URLs only (verified 2026-10-16: cha-slack-ceph-alerts,
  # cha-slack-ceph-critical, cha-slack-healthinfo), so the harness posts via
  # webhook; no bot token or signing secret exists there.
  slackPath: srenix/slack
  slackKeys:
    - secretKey: SLACK_WEBHOOK_URL
      property: cha-slack-healthinfo__WEBHOOK_URL

# GPU-AI gateway (OpenAI-compatible) as the harness model provider.
# The key is the same mcp_api_key the Paperclip deployment already syncs from
# Vault (shared/api-keys); the harness ESO cannot read that Vault path (its
# per-app identity only covers t6-apps/bionic-org/config and srenix/slack),
# so we reference the K8s secret bionic-org's ESO already owns in this
# namespace instead of duplicating the secret in Vault.
gpuai:
  enabled: true
  # OpenAI-compatible base URL served by the GPU box.
  baseURL: "https://mcp.baisoln.com/gpu-ai/v1"
  apiKeySecret: bionic-org-api-keys
  apiKeySecretKey: mcp_api_key
  # Model dsh uses by default (must exist on the gateway /v1/models list).
  model: "qwen3.8-flash-next-think"

persistence:
  enabled: true
  size: 5Gi
  storageClassName: ""   # empty uses cluster default
  # dsh home directory inside the image (node:24 user is `node`, uid 1000).
  home: /home/node/.dsh

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi

# Keep the harness off the node that hosts Paperclip, so a harness crash
# storm cannot compete with the system it monitors.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - gpu
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bionic-org

nodeSelector: {}
tolerations: []
