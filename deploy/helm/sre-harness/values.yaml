# Default configuration for the external SRE harness.

# Namespace the harness pod runs in. It MUST be the Paperclip namespace:
# the sre-harness-sa ServiceAccount lives there and a pod can only use a
# ServiceAccount from its own namespace. Isolation comes from separate
# workloads, labels, and its own PVC, and the RBAC matrix grants this SA
# rights in bionicorg plus the three website/demo namespaces.
namespace: bionicorg

image:
  # Pinned dsh harness image. Do NOT use a floating tag: the harness must
  # not change silently. Cut a new tag per reviewed upgrade.
  # Built from deploy/harness-image/Dockerfile (npm @deepseek-ai/dsh pinned).
  repository: docker4zerocool/dsh
  tag: "0.2.0-rc.2-b2"
  pullPolicy: IfNotPresent
  # The dsh repo is private (same Docker Hub account as the bionic image);
  # the secret is created by the bionic-org deploy in the target namespace.
  pullSecrets:
    - dockerhub-pull-secret

# Grace window between SIGTERM and SIGKILL. On a deadline kill the Job
# controller sends SIGTERM the instant activeDeadlineSeconds fires, then hard
# kills after this window. The run script spends part of it posting a partial
# report to Slack, so a cut-short run still leaves a trace (see
# "sre-harness.runHeadless" in templates/_helpers.tpl).
terminationGracePeriodSeconds: 60

# dsh web gateway. Upstream refuses to bind 0.0.0.0 on purpose (the UI can
# execute code), so dsh listens on loopback inside the pod. Operators reach
# it with:
#   kubectl -n bionicorg port-forward deploy/sre-harness 3080:3080
# because kubectl port-forward dials the pod's localhost. The ClusterIP
# Service is a naming convenience for port-forward; it cannot reach the UI.
ui:
  host: "127.0.0.1"
  port: 3080

rbac:
  clusterNodeRead:
    # Cluster-scoped READ of nodes, for the monitor only (see rbac.yaml). Set
    # false to fall back to inference-from-taints behavior.
    enabled: true

serviceAccount:
  # Name of the pre-provisioned RBAC ServiceAccount (deploy/rbac/sre-harness.yaml).
  # The namespaced Role and its RoleBindings are pre-provisioned too; the only
  # RBAC this chart creates is the optional cluster node-read (rbac.yaml),
  # gated by rbac.clusterNodeRead.enabled.
  name: sre-harness-sa

# Vault-backed credentials for the harness, via External Secrets Operator.
vault:
  enabled: true
  secretStoreKind: ClusterSecretStore
  secretStore: vault-backend
  refreshInterval: "1h"
  # Config secret holding the harness credentials. The chart syncs selected
  # properties; verify property names against Vault before first install.
  configPath: t6-apps/bionic-org/config
  configKeys:
    # secretKey in the synced K8s secret -> property name in Vault.
    # Verified against Vault 2026-10-16/17: this config path holds
    # sr_eng_agent_pat and deepseek_api_key but no SSH key. Git goes over
    # HTTPS with the PAT; add an ssh-key entry only once the property is
    # actually provisioned in Vault.
    - secretKey: GIT_PAT
      property: sr_eng_agent_pat
      optional: false
    - secretKey: DEEPSEEK_API_KEY
      property: deepseek_api_key
      optional: false
    # GPU build-host SSH identity (dedicated dshci build user, key pinned
    # to arrive only from the harness node; verified end-to-end 2026-10-18).
    # optional so components that never SSH are unaffected if absent.
    - secretKey: GPU_SSH_KEY
      property: gpu_ssh_key
      optional: true
    - secretKey: GPU_SSH_USER
      property: gpu_ssh_user
      optional: true
    - secretKey: GPU_SSH_PORT
      property: gpu_ssh_port
      optional: true
    - secretKey: GPU_KNOWN_HOSTS
      property: gpu_known_hosts
      optional: true
  # Slack notification target. The srenix/slack Vault path holds incoming
  # webhook URLs only (verified 2026-10-16: cha-slack-ceph-alerts,
  # cha-slack-ceph-critical, cha-slack-healthinfo), so the harness posts via
  # webhook; no bot token or signing secret exists there.
  slackPath: srenix/slack
  slackKeys:
    - secretKey: SLACK_WEBHOOK_URL
      property: cha-slack-healthinfo__WEBHOOK_URL

# GPU-AI gateway (OpenAI-compatible) as the harness model provider.
# The key is the same mcp_api_key the Paperclip deployment already syncs from
# Vault (shared/api-keys); the harness ESO cannot read that Vault path (its
# per-app identity only covers t6-apps/bionic-org/config and srenix/slack),
# so we reference the K8s secret bionic-org's ESO already owns in this
# namespace instead of duplicating the secret in Vault.
gpuai:
  enabled: true
  # OpenAI-compatible base URL served by the GPU box.
  baseURL: "https://mcp.baisoln.com/gpu-ai/v1"
  apiKeySecret: bionic-org-api-keys
  apiKeySecretKey: mcp_api_key
  # Model dsh uses by default (must exist on the gateway /v1/models list).
  model: "qwen3.8-flash-next-think"

# Where ssh looks for key material. OpenSSH uses the passwd home for uid 1000
# (`node`), not $HOME, so this is NOT the same path as `persistence.home`
# even though the run scripts export HOME to that value.
ssh:
  home: /home/node

# dsh permission mode for unattended sessions. The shipped profile derives its
# tool-approval policy from this variable:
#   (DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'
# In a Job there is no human to answer an approval prompt, so `ask` can only
# ever stall or fail. `danger-full-access` selects the supported headless
# stance (approval policy `never`). Blast radius stays bounded by what matters:
# the scoped sre-harness-sa RBAC, the fork-only Git identity, and the
# key-restricted dshci build user.
dsh:
  permissionMode: danger-full-access

build:
  # The dshci build identity's authorized_keys entry is restricted to a single
  # source node, so a build/deploy session scheduled anywhere else is refused
  # by the GPU host. Pin the SSH-using jobs to that node; "" disables the pin.
  nodeHostname: node1

persistence:
  enabled: true
  size: 5Gi
  storageClassName: ""   # empty uses cluster default
  # dsh home directory inside the image (node:24 user is `node`, uid 1000).
  home: /home/node/.dsh

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi

# Keep the harness off the node that hosts Paperclip, so a harness crash
# storm cannot compete with the system it monitors.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - gpu
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bionic-org

nodeSelector: {}
tolerations: []

# Git + build-host coordinates for the code-fix and deploy workflows.
repo:
  api: "https://api.github.com"
  # Fixes ALWAYS go to the fork. The upstream must never receive branches,
  # PRs, or comments from this harness.
  fork: "salilkadam/paperclip"
  upstream: "paperclipai/paperclip"
  baseBranch: "main"
  # Labels are the machine-readable handshake between the remediate and
  # approvals components; PRs this harness opens carry it, and only PRs
  # with it are ever considered for auto-merge after approval.
  fixLabel: "dsh-fix"

buildHost:
  # The GPU box address is deliberately NOT in this chart. The fork is
  # public, and a private LAN address committed here publishes lab topology
  # to anyone. The address arrives at runtime as GPU_SSH_HOST instead, from
  # the operator-managed ConfigMap named below. Create it once per
  # namespace, outside the chart:
  #   kubectl -n <namespace> create configmap sre-harness-buildhost \
  #     --from-literal=GPU_SSH_HOST=<address>
  # Operator-owned on purpose: the chart must not own a value that cannot be
  # public, and helm must never be able to revert it. User and port still
  # come from Vault (GPU_SSH_USER/GPU_SSH_PORT).
  hostConfigMap: "sre-harness-buildhost"
  # Optional override for an operator who keeps a private values file; an env
  # entry from here wins over the ConfigMap. Leave empty for a public install.
  host: ""
  # Container image used for local CI runs on the build host.
  ciImage: "node:24-trixie-slim"
  # Named docker volume for the pnpm store, so CI runs reuse packages
  # (first run minutes-slower, rest fast). Own residue, self-cleaned host.
  pnpmVolume: "dshci-pnpm-store"
  # CI container memory cap (repo pnpm install + build peaks ~8Gi).
  ciMemory: "12g"

# Proactive health monitor: a CronJob that runs the read-only sweep below
# through dsh headless and posts the verdict to the Slack health webhook.
# Deliberately read-only (get/list/logs/curl only): reporting is automated,
# remediation stays a human/agent decision.
monitor:
  enabled: true
  # Every half hour. The sweep itself takes 1-3 minutes.
  schedule: "*/30 * * * *"
  # Hard cap per run so a wedged dsh session cannot hold the Forbid lock.
  # A sweep on a quiet system takes 1-3 minutes, but one that overlaps a live
  # incident legitimately runs much longer: on 2026-10-18 three consecutive
  # sweeps investigating an MCP-upstream incident were killed mid-diagnosis at
  # 1200s (job DeadlineExceeded x3), silencing the monitor exactly when an
  # incident needed it, while healthy incident-free sweeps still took 4m50s-11m.
  # 2400s keeps >3x margin over the longest healthy run yet still bounds a
  # wedged session; a sweep that long skips at most one */30 tick (Forbid).
  activeDeadlineSeconds: 2400
  # Keep finished job objects for a day for forensics, then clean up.
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  prompt: |
    You are the Paperclip SRE health monitor. Run this read-only sweep of the
    bionicorg namespace and report. You MUST NOT create, delete, scale, patch,
    restart, or exec into anything: read-only kubectl (get/logs/events) and curl
    only. If a command fails, that failure is itself evidence - report it.

    Checks:
    1. `kubectl -n bionicorg get pods -o wide` - flag pods not Running or
       Completed, containers in CrashLoopBackOff/Error, or with restarts that
       look recent (cross-check with events).
    2. `curl -fsS -m 10 http://bionic-org.bionicorg.svc/api/health` - must
       return HTTP 200 and a healthy payload.
    3. `kubectl -n bionicorg logs deploy/bionic-org --since=40m` - search for
       error/fatal/exception lines; report counts and the notable distinct
       messages, ignoring known-benign routine noise.
    4. `kubectl -n bionicorg get events --sort-by=.lastTimestamp` - Warning
       events from the last 40 minutes.
    5. `kubectl -n bionicorg get jobs -o wide` - any Failed jobs (the
       sre-harness-monitor job failing is itself reportable). Supersession
       rule: these jobs use backoffLimit=0 on purpose - the next cron tick
       is the retry - so a Failed job that a newer Completed run of the
       same component superseded already retried and passed. Treat a
       superseded failure as stale history: mention it in one bullet, but
       it must not, alone or with other benign signals, make the verdict
       WARN or FAIL.

    Your final message MUST start with exactly one line, either:
    PAPERCLIP HEALTH: OK
    PAPERCLIP HEALTH: WARN
    PAPERCLIP HEALTH: FAIL
    Then at most 6 short evidence bullets (what/where/count). OK means every
    check passed. WARN means degraded but serving (e.g. recent restarts,
    benign-looking errors, unresolved warnings). FAIL means the API is unhealthy,
    a workload is down/crashlooping, or fresh fatal errors are appearing.

# Remediation: dispatched BY the monitor when a sweep reports WARN/FAIL
# (see monitor.remediation). One job, up to ~90 minutes, full engineer
# latitude within bounded rules: diagnose -> classify -> fix (cluster ops
# and/or code PR). It stops at an open PR; merging and deploying require
# the operator's approval via the approvals component.
remediate:
  enabled: true
  # Hard cap: diagnosis + CI on the GPU host can take tens of minutes, and a
  # full `pnpm install/typecheck/test/build` cycle alone has been observed near
  # 30 minutes. 3600 was tight enough to kill a healthy run mid-CI; 5400 then
  # killed another on 2026-10-26 (sre-harness-remediate-1793016081,
  # DeadlineExceeded). A remediation budget must cover clone + diagnose +
  # full CI + PR open, so keep >=2x margin over the longest plausible healthy
  # run; throttleHours below still bounds how often one can be dispatched.
  activeDeadlineSeconds: 10800
  # Never dispatch a second remediation if any remediate job started within
  # this many hours (a chronic WARN must not summon an army).
  throttleHours: 6
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
  prompt: |
    You are dsh, the external Site Reliability Engineer for the Paperclip
    platform. The scheduled health monitor reported WARN or FAIL and you
    were dispatched to remediate. You are an engineer, not a button: reach
    root causes, fix with code when code is the fix, and report honestly.

    Environment facts:
    - Read the triggering verdict first:
        kubectl -n bionicorg get jobs -l app.kubernetes.io/component=monitor --sort-by=.metadata.creationTimestamp
        kubectl -n bionicorg logs <newest monitor job>
    - bionicorg runs the platform (deploy/bionic-org). Postgres lives in the
      pg namespace: NEVER touch pg/ceph namespaces or any database data.
    - Git fork: salilkadam/paperclip on github.com; credential in $GIT_PAT;
      clone via https://x-access-token:${GIT_PAT}@github.com/salilkadam/paperclip.git
      NEVER open branches/PRs/comments against the upstream paperclipai/paperclip.
    - GPU build host: ssh -p $GPU_SSH_PORT $GPU_SSH_USER@$GPU_SSH_HOST
      (key + pinned host keys already in ~/.ssh, address in $GPU_SSH_HOST).
      Docker works there. It is a build box: still clean up anything you
      create on it.
    - Your final chat message is auto-posted to the operator's Slack.

    Method, in order:
    1. Re-verify current state independently; a transient may already be
       gone. Never fix what is no longer broken.
    1b. Check for work already in flight before you start. List the open fix
       PRs and the dshfix/* branches:
         curl -s -H "Authorization: Bearer $GIT_PAT" \
           "{{ .Values.repo.api }}/repos/{{ .Values.repo.fork }}/pulls?state=open"
       If an open PR or branch already covers this fault, do NOT re-diagnose
       it and do NOT re-fix it. Report "already covered by <PR link>", say
       what the PR does, and stop. Duplicate engineer-hours cost real money.
    2. Diagnose with evidence (logs, events, code). State the root cause
       before touching anything.
    3. Classify, then act:
       a) External/transient (upstream 5xx, one-off DB lock timeout, node
          blip): take no action; record the evidence.
       b) Cluster-ops issue fixable in runtime state: least-invasive action
          in the monitored namespaces only (rollout restart > delete a pod
          that has a controller > restore intended replica count). These are
          the only cluster writes allowed here: restart, pod delete, replica
          restore. Never force-delete, never scale bionic-org to 0, no data
          mutations.
          Never patch a field a Helm chart owns. A live object's spec is not
          the source of truth; the chart is. If the right fix is a value the
          chart sets (a deadline, a resource limit, a schedule, a prompt, a
          ConfigMap), then `kubectl patch` only causes drift: the next
          upgrade silently reverts it and the fault comes back. Treat that as
          case (c) and change the chart in a PR instead. This applies to the
          harness's own objects too (sre-harness CronJobs and ConfigMaps).
       c) Code defect: fix it properly.
          - Clone the fork into this run's scratch dir with the base branch
            explicit: `git clone --branch {{ .Values.repo.baseBranch }}
            --single-branch <fork-url> <scratch-dir>`. Never branch from the
            clone's default HEAD. On {{ .Values.repo.fork }} the default
            branch is `master` and it trails {{ .Values.repo.baseBranch }} by
            dozens of commits, so a branch cut from default HEAD resurrects
            code that main already deleted and its PR cannot merge cleanly.
            Read the current {{ .Values.repo.baseBranch }} head sha from the
            API first, then confirm `git rev-parse HEAD` equals it before you
            edit anything. Branch dshfix/<slug>-$(date -u +%m%d%H%M) from that
            verified head; minimal root-cause fix in the codebase's style.
          - Mandatory CI on the GPU build host (GitHub Actions is forbidden
            for cost): push the branch, then
              ssh -p $GPU_SSH_PORT $GPU_SSH_USER@$GPU_SSH_HOST docker run --rm \
                -m {{ .Values.buildHost.ciMemory }} \
                -v {{ .Values.buildHost.pnpmVolume }}:/pnpm -e HOME=/pnpm \
                {{ .Values.buildHost.ciImage }} sh -c '<clone this branch,
                corepack enable, pnpm install --frozen-lockfile,
                pnpm -r typecheck, pnpm test:run, pnpm build>'
            Allow tens of minutes. CI red -> iterate, or abandon the fix
            and say so; NEVER open a PR with red CI.
          - Open the PR into {{ .Values.repo.baseBranch }} of {{ .Values.repo.fork }}
            with curl against {{ .Values.repo.api }} (no gh CLI). Title:
            conventional-commit style. Body: follow the repo PR template
            (Thinking Path / What Changed / Verification / Risks / Model
            Used / Checklist) including the CI command summary, the CI
            results, and the base sha the branch was cut from.
            Add label {{ .Values.repo.fixLabel }} (create the label first if
            missing).
          - STOP at the PR. You never merge and never deploy. Merge and
            deploy happen only after the operator approves, via a separate
            approvals job.
    4. Final report (last message; auto-posted): verdict re-check, root
       cause with evidence, classification a/b/c, actions taken, PR link
       with 2-line why + CI evidence if opened, and what to watch next.

    Hard bans: no secrets in logs or the report; no kubectl writes outside
    the monitored namespaces; no kubectl patch/edit/replace/apply on a spec
    field a Helm chart owns (that is a chart PR, case (c)); no DB writes; no
    merges; no deploys; no upstream repo contact.

# Approvals watcher: the operator's approve/decline gate. Every tick it
# cheaply (no LLM) scans {{ .Values.repo.fork }} for OPEN PRs labeled
# {{ .Values.repo.fixLabel }} that the approvers list has decided on. No decision ->
# silent exit. Approved -> dsh runs the merge + GPU-build + helm-deploy
# runbook. Declined -> PR closed with the reason recorded. The operator
# approves with a GitHub PR review (Approve) or a PR comment starting
# "deploy: approve" / "deploy: decline <reason>".
approvals:
  enabled: true
  schedule: "*/15 * * * *"
  # The scan is seconds; the deploy path is a GPU image build plus a helm
  # rollout, which is not.
  activeDeadlineSeconds: 5400
  approvers:
    - "salilkadam"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  prompt: |
    You are dsh, the external SRE for Paperclip. The operator has just
    rendered a decision on one of your fix PRs. Decision data (JSON):

    __DECISION_JSON__

    Rules of engagement:
    - Act ONLY on the PR named in the decision. Never merge anything else;
      never touch {{ .Values.repo.upstream }}.
    - Use curl against {{ .Values.repo.api }} with $GIT_PAT (no gh CLI).
    - Your final message is auto-posted to the operator's Slack.
    - Before you finish an APPROVE attempt, always leave one comment on the PR
      whose first line starts with `dsh-action:` - merged, blocked, or failed,
      then a short reason:
        `dsh-action: merged <merge-sha> image <tag> helm rev <new-rev>`
        `dsh-action: blocked <short reason>`
        `dsh-action: failed <short reason>`
      That comment is the idempotency marker. The watcher ignores a decision
      that a later `dsh-action:` comment follows. If you stop without it, the
      same decision matches again in 15 minutes and this whole attempt runs
      again, burning a build and re-posting to Slack. Never put a secret in it.
    If decision is APPROVE:
    1. Re-verify: PR still open, still labeled {{ .Values.repo.fixLabel }}, head SHA
       matches, approval still stands, and it is mergeable. If any check
       fails (e.g. conflicts after main moved), post exactly what blocks it,
       leave the `dsh-action: blocked` marker, and STOP - do not rebase-merge silently.
    2. Squash-merge via the API with expected head sha. Record merge sha.
    3. Update the build clone on the GPU host to {{ .Values.repo.baseBranch }} head = the
       merge commit; deploy tag = `git rev-parse --short HEAD`.
    4. Build + push on the GPU build host (ssh -p $GPU_SSH_PORT
       $GPU_SSH_USER@$GPU_SSH_HOST): clone {{ .Values.repo.fork }} at that sha into a
       throwaway dir, run ./deploy/scripts/build-and-push.sh <tag> (it
       builds, pushes, and cleans the local image itself), then delete the
       clone dir. Do NOT touch the cluster from the build host.
    5. Deploy from inside this pod with the harness's own scoped identity:
       build a kubeconfig from the mounted service-account files under
       /var/run/secrets/kubernetes.io/serviceaccount (server
       https://kubernetes.default.svc, namespace {{ .Values.namespace }}), then from
       the same clone:
         helm upgrade --install bionic-org deploy/helm/bionic-org \
           -n {{ .Values.namespace }} --set image.tag=<tag> --history-max 20 \
           --wait --timeout 10m
       (never --atomic). Then verify: kubectl rollout status
       deploy/bionic-org; curl http://bionic-org.{{ .Values.namespace }}.svc/api/health.
    6. Report: PR link + merge sha, image tag, helm old-rev -> new-rev
       (helm history --max 3), rollout + health result. On ANY failure: do
       not blind-rollback; post the failing state, helm history tail, and
       the exact suggested rollback command, loudly marked FAILED, and the retry
       route: the operator posts a NEW comment starting `deploy: approve`.

    If decision is DECLINE:
    1. Comment on the PR recording the decline reason, then close it via
       the API.
    2. Report what was declined and why, so the finding is not lost.

    Hard bans: no secrets in the report; no merges outside the decision;
    no cluster writes from the GPU host; if deploy fails, report rather
    than improvise.
