{{- if .Values.remediate.enabled }}
# Suspended CronJob used purely as a JOB TEMPLATE: the monitor creates
# jobs from it (kubectl create job --from=cronjob/sre-harness-remediate)
# when a sweep reports WARN/FAIL. suspend: true guarantees the schedule
# field (a never-matching winter time) can never fire on its own.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sre-harness.fullname" . }}-remediate
  namespace: {{ include "sre-harness.namespace" . }}
  labels:
    {{- include "sre-harness.labels" . | nindent 4 }}
    app.kubernetes.io/component: remediate
spec:
  schedule: "0 0 1 1 0"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.remediate.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ .Values.monitor.ttlSecondsAfterFinished }}
      # One attempt: a half-finished remediation must not silently rerun
      # against drifted state. The next WARN (after the throttle window)
      # dispatches a fresh, context-aware engineer instead.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "sre-harness.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: remediate
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
          serviceAccountName: {{ .Values.serviceAccount.name }}
          automountServiceAccountToken: false
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- range . }}
            - name: {{ . }}
            {{- end }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          affinity:
            {{- toYaml .Values.affinity | nindent 12 }}
          {{- with (include "sre-harness.buildNodeSelector" .) }}
          nodeSelector:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: remediate
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /bin/sh
                - /config/run.sh
              env:
                # Nothing answers a tool-approval prompt inside a Job.
                - name: DSH_PERMISSION_MODE
                  value: {{ .Values.dsh.permissionMode | quote }}
                - name: GPUAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.gpuai.apiKeySecret }}
                      key: {{ .Values.gpuai.apiKeySecretKey }}
                      optional: true
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "sre-harness.fullname" . }}-slack
                      key: SLACK_WEBHOOK_URL
                      optional: true
              envFrom:
                # Operator-managed, never chart-owned: carries GPU_SSH_HOST,
                # the build-host address that must not live in a public repo.
                - configMapRef:
                    name: {{ .Values.buildHost.hostConfigMap }}
                    optional: true
                # GIT_PAT + GPU SSH identity arrive here (config secret is
                # optional:true at the secretRef level so a missing Vault
                # sync degrades to a clearly-failing session, not a
                # blocked pod start).
                - secretRef:
                    name: {{ include "sre-harness.fullname" . }}-config
                    optional: true
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: sa-token
                  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  readOnly: true
                - name: dsh-home
                  mountPath: /home/node/.dsh
              resources:
                {{- toYaml .Values.remediate.resources | nindent 16 }}
          volumes:
            - name: config
              configMap:
                name: {{ include "sre-harness.fullname" . }}-remediate-config
            - name: sa-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 3600
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
                  - downwardAPI:
                      items:
                        - path: namespace
                          fieldRef:
                            fieldPath: metadata.namespace
            - name: dsh-home
              emptyDir: {}
{{- end }}
