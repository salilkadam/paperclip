{{- if .Values.remediate.enabled }}
# Remediation engineer. Created by the monitor on WARN/FAIL (never on a
# schedule: this CronJob is a suspended job template that the monitor
# instantiates with `kubectl create job --from=cronjob/...`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre-harness.fullname" . }}-remediate-config
  namespace: {{ include "sre-harness.namespace" . }}
  labels:
    {{- include "sre-harness.labels" . | nindent 4 }}
    app.kubernetes.io/component: remediate
data:
  remediate-prompt.md: |
    {{- tpl .Values.remediate.prompt . | nindent 4 }}
  gpuai.patch.yml: |
    {{- include "sre-harness.gpuaiPatch" . | nindent 4 }}
  run.sh: |
    #!/bin/sh
    # One remediation session: full engineer runbook lives in the prompt;
    # this wrapper only prepares identity, runs dsh headless, and relays
    # the report to Slack.
    set -eu

    export HOME=/home/node/.dsh
    {{- include "sre-harness.sshBootstrap" . | nindent 4 }}

    post_to_slack() {
      SLACK_TEXT="$1" node -e '
        const url = process.env.SLACK_WEBHOOK_URL;
        const text = String(process.env.SLACK_TEXT || "").slice(0, 12000);
        if (!url) {
          console.log("[remediate] no webhook configured; report:\n" + text);
          process.exit(0);
        }
        // A webhook that never answers must not eat the SIGTERM grace
        // window: the deadline-kill trap posts here before it records the
        // run, and an unbounded fetch outlives the pod with both.
        fetch(url, {
          signal: AbortSignal.timeout(10000),
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ text }),
        })
          .then((r) => {
            if (!r.ok) throw new Error("HTTP " + r.status);
            console.log("[remediate] report posted to slack");
          })
          .catch((e) => {
            console.error("[remediate] slack post failed: " + e.message);
            console.log("[remediate] report:\n" + text);
          });
      '
    }

    TASK="$(cat /config/remediate-prompt.md)"
    DSH_PROFILE=remediate

    set +e
    {{- include "sre-harness.runHeadless" . | nindent 4 }}
    set -e

    if [ "$DSH_RC" -ne 0 ]; then
      # The engineer session itself failed mid-remediation: say so loudly,
      # an interrupted fix is itself an operational signal. Full event stream
      # is in this job's log.
      post_to_slack "REMEDIATION RUN FAILED (dsh exit $DSH_RC) - partial state possible, check bionicorg + fork PRs: $DSH_FINAL"
      exit 1
    fi
    post_to_slack "SRE REMEDIATION REPORT: $DSH_FINAL"
{{- end }}
