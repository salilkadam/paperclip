apiVersion: v1
kind: Service
metadata:
  name: {{ include "sre-harness.fullname" . }}
  namespace: {{ include "sre-harness.namespace" . }}
  labels:
    {{- include "sre-harness.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: {{ include "sre-harness.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
      nodePort: {{ .Values.ui.nodePort }}
