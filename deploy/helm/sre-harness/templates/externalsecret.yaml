{{- if .Values.vault.enabled }}
# Harness credentials (DeepSeek key, git PAT, SSH key) from the org config
# secret. Property names in values.yaml must match Vault; verify before
# relying on the sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sre-harness.fullname" . }}-config
  namespace: {{ include "sre-harness.namespace" . }}
  labels:
    {{- include "sre-harness.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.vault.secretStoreKind }}
    name: {{ .Values.vault.secretStore }}
  target:
    creationPolicy: Owner
    name: {{ include "sre-harness.fullname" . }}-config
  data:
    {{- range .Values.vault.configKeys }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $.Values.vault.configPath }}
        property: {{ .property }}
      {{- if .optional }}
      optional: true
      {{- end }}
    {{- end }}
---
# Slack incoming webhook for harness notifications, from the srenix Slack
# path (webhook URLs only; verified against Vault).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sre-harness.fullname" . }}-slack
  namespace: {{ include "sre-harness.namespace" . }}
  labels:
    {{- include "sre-harness.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.vault.secretStoreKind }}
    name: {{ .Values.vault.secretStore }}
  target:
    creationPolicy: Owner
    name: {{ include "sre-harness.fullname" . }}-slack
  data:
    {{- range .Values.vault.slackKeys }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $.Values.vault.slackPath }}
        property: {{ .property }}
    {{- end }}
{{- end }}
