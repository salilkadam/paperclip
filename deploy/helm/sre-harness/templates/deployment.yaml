apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sre-harness.fullname" . }}
  namespace: {{ include "sre-harness.namespace" . }}
  labels:
    {{- include "sre-harness.labels" . | nindent 4 }}
spec:
  # Single replica on purpose: two harnesses would fight over the same
  # remediation actions.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sre-harness.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sre-harness.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # RBAC is pre-provisioned by deploy/rbac/sre-harness.yaml. The SA has
      # automountServiceAccountToken: false, so project the token explicitly
      # for the kubectl the harness shells out to.
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        # Image runs as `node` (uid/gid 1000); fsGroup makes the dsh-state
        # PVC writable by that user.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Self-heal credential file permissions before dsh starts. dsh
        # refuses to boot if .credentials.yaml is group/world readable
        # (assertOwnerOnly); a UI write under fsGroup's setgid directory can
        # produce mode 660 and permanently crashloop the harness.
        - name: fix-state-perms
          image: docker.io/library/alpine:3.20
          command:
            - sh
            - -c
            - >-
              find {{ .Values.persistence.home }} -maxdepth 1 -name
              '.credentials*' -exec chmod 600 {} + 2>/dev/null; exit 0
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- range . }}
            - name: {{ . }}
            {{- end }}
          {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: state
              mountPath: {{ .Values.persistence.home }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: dsh
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - web
            - --host
            - {{ .Values.ui.host | quote }}
            - --port
            - {{ .Values.ui.port | quote }}
            - --no-open
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
          # dsh binds loopback only (upstream safety); kubelet probes go
          # over the pod IP and would be refused, so the probe has to be an
          # exec that dials 127.0.0.1 from inside the container. Use bash's
          # /dev/tcp, not `node -e`: the kubelet exec-probe timeout is
          # hardcoded at 1s (ExecProbeTimeout gate removed in k8s 1.30), and
          # a Node cold start - ~25ms idle, easily >1s under CPU pressure on
          # the control-plane node this pod pins to - blew that budget 107
          # readiness-probe timeouts in 3.5 days. bash /dev/tcp connects in
          # ~1ms and leaves no room for process-spawn jitter.
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - exec 3<>/dev/tcp/127.0.0.1/{{ .Values.ui.port }} 2>/dev/null
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - exec 3<>/dev/tcp/127.0.0.1/{{ .Values.ui.port }} 2>/dev/null
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- if .Values.gpuai.enabled }}
          env:
            # GPU-AI gateway key for the dsh llm-pi-ai gpuai provider
            # (see deploy/harness-image/dsh-profile-patch.yml). optional:
            # true so the harness still boots if bionic-org is not deployed
            # yet; the gpuai route then fails auth instead of the pod.
            - name: GPUAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gpuai.apiKeySecret }}
                  key: {{ .Values.gpuai.apiKeySecretKey }}
                  optional: true
          {{- end }}
          envFrom:
            {{- if .Values.vault.enabled }}
            - secretRef:
                name: {{ include "sre-harness.fullname" . }}-config
            - secretRef:
                name: {{ include "sre-harness.fullname" . }}-slack
                optional: true
            {{- end }}
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: state
              mountPath: {{ .Values.persistence.home }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "sre-harness.fullname" . }}-state
          {{- else }}
          emptyDir: {}
          {{- end }}
