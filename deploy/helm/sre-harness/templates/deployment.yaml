apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sre-harness.fullname" . }}
  namespace: {{ include "sre-harness.namespace" . }}
  labels:
    {{- include "sre-harness.labels" . | nindent 4 }}
spec:
  # Single replica on purpose: two harnesses would fight over the same
  # remediation actions.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sre-harness.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sre-harness.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # RBAC is pre-provisioned by deploy/rbac/sre-harness.yaml. The SA has
      # automountServiceAccountToken: false, so project the token explicitly
      # for the kubectl the harness shells out to.
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # Image runs as `node` (uid/gid 1000); fsGroup makes the dsh-state
        # PVC writable by that user.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dsh
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - web
            - --host
            - {{ .Values.ui.host | quote }}
            - --port
            - {{ .Values.ui.port | quote }}
            - --no-open
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          envFrom:
            {{- if .Values.vault.enabled }}
            - secretRef:
                name: {{ include "sre-harness.fullname" . }}-config
            - secretRef:
                name: {{ include "sre-harness.fullname" . }}-slack
                optional: true
            {{- end }}
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: state
              mountPath: {{ .Values.persistence.home }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "sre-harness.fullname" . }}-state
          {{- else }}
          emptyDir: {}
          {{- end }}
