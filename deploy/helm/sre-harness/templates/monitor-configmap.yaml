{{- if .Values.monitor.enabled }}
# Everything the monitor CronJob needs, rebuilt with the release:
#   prompt.md         the read-only sweep instructions (from .Values.monitor.prompt)
#   gpuai.patch.yml   dsh model config, templated from .Values.gpuai so the
#                     monitor always points at the same gateway/model as the
#                     interactive harness without touching the state PVC
#   run.sh            runner: dsh headless sweep -> Slack webhook post
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre-harness.fullname" . }}-monitor-config
  namespace: {{ include "sre-harness.namespace" . }}
  labels:
    {{- include "sre-harness.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitor
data:
  prompt.md: |
    {{- .Values.monitor.prompt | nindent 4 }}
  # The kubelet-proxy probe from check 6, shipped as data next to the prompt
  # it is referenced from, not via .Files.Get: a chart that renders outside
  # its directory (a packaged .tgz, or a repo root other than the checkout
  # layout) makes .Files.Get a render-time failure or an empty key, and an
  # empty probe is exactly the silent-breakage class this chart keeps
  # getting burned by. This copy must stay in sync with
  # deploy/helm/sre-harness/probe-node-proxy.sh -- the chart test renders the
  # ConfigMap and asserts it equals the script file, so drift fails CI.
  probe-node-proxy.sh: |
    {{- .Files.Get "probe-node-proxy.sh" | nindent 4 }}
  gpuai.patch.yml: |
    {{- include "sre-harness.gpuaiPatch" . | nindent 4 }}
  run.sh: |
    #!/bin/sh
    # Paperclip health sweep: run the prompt through dsh headless, then post
    # the agent's verdict to the Slack health webhook. Best-effort posting:
    # a Slack failure must never mask (or fake) the monitor result.
    set -eu

    # Fresh dsh home every run. --from-default-profile seeds the profile from
    # the image defaults, so a stale/edited profile on the (RWO, web-pod-only)
    # state PVC can neither break the run nor silently change the model.
    export HOME=/home/node/.dsh

    post_to_slack() {
      SLACK_TEXT="$1" node -e '
        const url = process.env.SLACK_WEBHOOK_URL;
        const text = String(process.env.SLACK_TEXT || "").slice(0, 12000);
        if (!url) {
          console.log("[monitor] no webhook configured; verdict:\n" + text);
          process.exit(0);
        }
        // A webhook that never answers must not eat the SIGTERM grace
        // window: the deadline-kill trap posts here before it records the
        // run, and an unbounded fetch outlives the pod with both.
        fetch(url, {
          signal: AbortSignal.timeout(10000),
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ text }),
        })
          .then((r) => {
            if (!r.ok) throw new Error("HTTP " + r.status);
            console.log("[monitor] verdict posted to slack");
          })
          .catch((e) => {
            console.error("[monitor] slack post failed: " + e.message);
            console.log("[monitor] verdict:\n" + text);
          });
      '
    }

    TASK="$(cat /config/prompt.md)"

    # Stream the session. A buffered `OUT=$(dsh ...)` loses all evidence when a
    # sweep is killed by activeDeadlineSeconds: the job log is empty and the
    # verdict is unrecoverable, so we cannot tell a slow sweep from a broken
    # prompt. --json events go to the log as they happen.
    DSH_PROFILE=monitor
    # Watchdog self-report margin (see sre-harness.runHeadless): the 2026-10-18
    # sweep died at the hard deadline with nothing to show; this ends a stuck
    # sweep 300s early with a report instead.
    DSH_SOFT_LIMIT_SECONDS={{ sub .Values.monitor.activeDeadlineSeconds 300 }}
    set +e
{{- include "sre-harness.runHeadless" . | nindent 4 }}
    set -e

    if [ "$DSH_RC" -ne 0 ]; then
      # The sweep itself failed; that is an operational signal, shout it.
      printf '%s\n' "$DSH_FINAL"
      post_to_slack "MONITOR RUN FAILED (dsh exit $DSH_RC): $DSH_FINAL"
      exit 1
    fi

    # Dispatch hook: WARN/FAIL summons one remediation engineer (bounded:
    # one at a time, at most one per throttle window). The remediation
    # job re-reads this verdict itself; we only pull the trigger here.
    #
    # The verdict used to be the whole trigger, and that closed a loop with
    # nobody standing outside it. A remediation engineer that dies on its own
    # deadline leaves a Failed job labelled component=remediate; the sweep's
    # supersession rule cannot retire it (the remediate CronJob is suspended,
    # so no newer Completed run of that component will ever exist); so every
    # sweep for the next 24h - the job's TTL - called WARN on a platform that
    # was serving fine, and each throttle window summoned a fresh engineer for
    # another 90 minutes to chase the absence of the previous one. Seen on
    # 2026-11-03: 20 consecutive sweeps all WARN, three engineers dispatched,
    # nothing wrong with Paperclip.
    #
    # The sweep now states in words whether an engineer is needed and the
    # trigger requires that word. Missing line means no dispatch, which is the
    # safe direction inside a loop the harness is a party to: the operator
    # still gets the verdict plus the note below and pulls the trigger by hand.
    DISPATCH_NOTE=""
    DISPATCH_WANTED=0
    if [ "${REMEDIATION_ENABLED:-false}" = "true" ] && \
       printf '%s\n' "$DSH_FINAL" | grep -qE 'PAPERCLIP HEALTH: (WARN|FAIL)'; then
      DISPATCH_LINE=$(printf '%s\n' "$DSH_FINAL" | grep -m1 -iE 'DISPATCH:[[:space:]]*(yes|no)' || true)
      if printf '%s\n' "$DISPATCH_LINE" | grep -qiE 'DISPATCH:[[:space:]]*yes'; then
        DISPATCH_WANTED=1
      else
        # Loud on purpose: a WARN that asks for nobody has to read as a
        # decision, not as a silent gap where an engineer used to appear.
        DISPATCH_NOTE="no engineer dispatched; the sweep did not request one (manual: kubectl create job <name> --from=cronjob/sre-harness-remediate)"
      fi
    fi
    if [ "$DISPATCH_WANTED" = "1" ]; then
      ACTIVE=$(kubectl get jobs -l app.kubernetes.io/component=remediate \
        -o jsonpath='{.items[*].status.active}' 2>/dev/null || true)
      LAST=$(kubectl get jobs -l app.kubernetes.io/component=remediate \
        --sort-by=.metadata.creationTimestamp \
        -o jsonpath='{.items[-1:].metadata.creationTimestamp}' 2>/dev/null || true)
      THROTTLED=0
      if [ -n "$LAST" ]; then
        LAST_EPOCH=$(date -d "$LAST" +%s 2>/dev/null || echo 0)
        NOW_EPOCH=$(date +%s)
        if [ $(( (NOW_EPOCH - LAST_EPOCH) / 3600 )) -lt "${REMEDIATION_THROTTLE_HOURS:-6}" ]; then
          THROTTLED=1
        fi
      fi
      if [ -n "$ACTIVE" ]; then
        DISPATCH_NOTE="remediation already in progress; no new dispatch"
      elif [ "$THROTTLED" = "1" ]; then
        DISPATCH_NOTE="remediation throttled (last run within ${REMEDIATION_THROTTLE_HOURS:-6}h)"
      else
        JOB="sre-harness-remediate-$(date +%s)"
        if kubectl create job "$JOB" --from=cronjob/sre-harness-remediate >/dev/null 2>&1; then
          DISPATCH_NOTE="remediation dispatched: $JOB"
        else
          DISPATCH_NOTE="ERROR: failed to dispatch remediation job"
        fi
      fi
    fi

    # Record the verdict in the job log too, so evidence survives alongside
    # the Slack post. The job log used to be "the forensic path" (kubectl logs
    # job/...); on a node whose kubelet proxy black-holes (502 on every
    # proxy read, 2026-11-09) it is unreadable by design, so the durable
    # record is the run-log ConfigMap and the job log only when readable.
    printf '%s\n' "$DSH_FINAL"
    if [ -n "$DISPATCH_NOTE" ]; then
      # The dispatch decision belongs in the job log too. Without it, a reader
      # cannot tell whether this run summoned a remediation engineer, was
      # throttled, or found nothing to do.
      printf '[monitor] dispatch: %s\n' "$DISPATCH_NOTE"
      post_to_slack "$DSH_FINAL

    [$DISPATCH_NOTE]"
    else
      post_to_slack "$DSH_FINAL"
    fi
{{- end }}
