{{- if .Values.opsServiceAccount.enabled }}
# Identity-only ServiceAccount for ops scripts' short-lived Vault login
# (deploy/scripts/lib/vault-ops.sh). Never mounted into a pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.opsServiceAccount.name }}
  namespace: {{ .Values.namespace | default .Release.Name }}
  labels:
    {{- include "bionic-org.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
