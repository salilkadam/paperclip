{{- if .Values.vault.mediaS3.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.vault.mediaS3.secretName }}
  namespace: {{ .Values.namespace | default .Release.Name }}
  labels:
    {{- include "bionic-org.labels" . | nindent 4 }}
  annotations:
    force-sync: "{{ now | date "1000000000" }}"
spec:
  # Scoped media-bucket credentials for the central video skills
  # (skills/marketing-video-studio). Only the three properties the skills need
  # are synced, never the rest of the source Vault path.
  data:
    - secretKey: access_key
      remoteRef:
        key: {{ .Values.vault.mediaS3.path }}
        property: {{ .Values.vault.mediaS3.accessKeyProperty }}
    - secretKey: secret_key
      remoteRef:
        key: {{ .Values.vault.mediaS3.path }}
        property: {{ .Values.vault.mediaS3.secretKeyProperty }}
    - secretKey: bucket
      remoteRef:
        key: {{ .Values.vault.mediaS3.path }}
        property: {{ .Values.vault.mediaS3.bucketProperty }}
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.vault.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.vault.secretStore }}
  target:
    creationPolicy: Owner
    deletionPolicy: {{ .Values.vault.deletionPolicy }}
    name: {{ .Values.vault.mediaS3.secretName }}
{{- end }}
