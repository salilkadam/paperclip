apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bionic-org.name" . }}
  namespace: {{ .Values.namespace | default .Release.Name }}
  labels:
    {{- include "bionic-org.labels" . | nindent 4 }}
    app: bionic-org
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bionic-org.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        {{- include "bionic-org.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.persistence.enabled }}
      securityContext:
        fsGroup: {{ .Values.persistence.fsGroup }}
      {{- end }}
      serviceAccountName: {{ include "bionic-org.name" . }}-sa
    {{- with .Values.imagePullSecret }}
      {{- if .enabled }}
      imagePullSecrets:
        - name: {{ .name }}
      {{- end }}
    {{- end }}
      dnsConfig:
        options:
          {{- toYaml .Values.dnsConfig.options | nindent 10 }}
      containers:
        - name: bionic
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "bionic-org.name" . }}-config
            {{- if .Values.vault.apiKeysPath }}
            # Org-wide shared provider API keys (from Vault {{ .Values.vault.apiKeysPath }}).
            # Keys land as env vars verbatim (anthropic_api_key, github_token, ...);
            # heartbeat adapter child processes inherit them.
            - secretRef:
                name: {{ .Values.vault.apiKeysSecretName }}
                optional: true
            {{- end }}
          env:
            {{- if .Values.vault.apiKeysPath }}
            # Canonical aliases for CLIs that expect uppercase names.
            # ANTHROPIC_API_KEY is deliberately NOT aliased by default:
            # Claude Code/ACP picks API-key auth whenever ANTHROPIC_API_KEY is
            # present, overriding every claude_local agent's subscription token
            # and billing prepaid credits (2026-10-06 "Credit balance is too
            # low" incident). See vault.anthropicApiKeyAlias in values.yaml.
            {{- if .Values.vault.anthropicApiKeyAlias }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  key: anthropic_api_key
                  name: {{ .Values.vault.apiKeysSecretName }}
                  optional: true
            {{- end }}
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  key: claude_subscription_token
                  name: {{ .Values.vault.apiKeysSecretName }}
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.vault.agentGithubPat.enabled }}
                  # Vault t6-apps/bionic-org/config:sr_eng_agent_pat → ESO →
                  # <release>-secrets. Prefer this dedicated agent key over the
                  # shared org-wide github_token.
                  key: {{ .Values.vault.agentGithubPat.secretKey }}
                  name: {{ include "bionic-org.name" . }}-secrets
                  {{- else }}
                  key: github_token
                  name: {{ .Values.vault.apiKeysSecretName }}
                  {{- end }}
                  optional: true
            {{- if .Values.vault.agentGithubPat.enabled }}
            # Git-credential bridge for raw `git push`/`git fetch` over https
            # (GITHUB_TOKEN alone only covers gh CLI/API). Host-scoped to
            # github.com; the helper shell-expands $GITHUB_TOKEN at credential
            # request time, so the PAT is never written to disk (the pod HOME
            # is ephemeral anyway). GIT_CONFIG_* requires git >= 2.32.
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: credential.https://github.com.helper
            - name: GIT_CONFIG_VALUE_0
              value: '!f() { test "$1" = get || exit 1; [ -n "$GITHUB_TOKEN" ] || exit 1; echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f'
            {{- end }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: openai_api_key
                  name: {{ .Values.vault.apiKeysSecretName }}
                  optional: true
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: database_url
                  name: {{ include "bionic-org.name" . }}-secrets
            # google_auth_token (Vault t6-apps/bionic-org/config) = Google OAuth
            # WEB-CLIENT JSON (client_id + client_secret). Nothing in server/, ui/
            # or packages/ reads this env var; it is parked here for operator
            # tooling only, so replacing it changes no runtime behaviour.
            # It is NOT a Drive access token, and it is NOT the credential the
            # gworkspace MCP server uses to talk to Google: the gworkspace tenant
            # OAuth client lives in Vault t6-apps/mcp/config key
            # gworkspace_tenants_json (ESO secret mcp-gworkspace-tenants, mounted
            # at /etc/mcp/tenants.json). Rotating one does not rotate the other.
            # Never send this value as a bearer/apikey to the gworkspace MCP
            # server - that server only trusts Kong-injected consumer headers.
            - name: GOOGLE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  key: google_auth_token
                  name: {{ include "bionic-org.name" . }}-secrets
                  optional: true
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  key: better_auth_secret
                  name: {{ include "bionic-org.name" . }}-secrets
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: session_secret
                  name: {{ include "bionic-org.name" . }}-secrets
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: keycloak_client_id
                  name: {{ include "bionic-org.name" . }}-secrets
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: keycloak_client_secret
                  name: {{ include "bionic-org.name" . }}-secrets
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  key: vault_token
                  name: {{ include "bionic-org.name" . }}-secrets
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  key: minio_root_user
                  name: {{ include "bionic-org.name" . }}-secrets
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: minio_root_password
                  name: {{ include "bionic-org.name" . }}-secrets
            # Paperclip secrets master key (local_encrypted provider). MUST come
            # from Vault; if absent the app silently regenerates a new key on a
            # fresh filesystem and all previously encrypted secrets become
            # unreadable. See the 2026-10-06 incident.
            - name: PAPERCLIP_SECRETS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.vault.masterKeySecretKey }}
                  name: {{ include "bionic-org.name" . }}-secrets
          {{- if eq .Values.env.PAPERCLIP_STORAGE_PROVIDER "s3" }}
            - name: PAPERCLIP_STORAGE_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  key: storage_s3_bucket
                  name: {{ include "bionic-org.name" . }}-secrets
            - name: PAPERCLIP_STORAGE_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  key: storage_s3_endpoint
                  name: {{ include "bionic-org.name" . }}-secrets
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: paperclip-data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: paperclip-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.name }}
      {{- end }}
