apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bionic-org.name" . }}-secrets
  namespace: {{ .Values.namespace | default .Release.Name }}
  labels:
    {{- include "bionic-org.labels" . | nindent 4 }}
  annotations:
    force-sync: "{{ now | date "1000000000" }}"
spec:
  # Sync all keys from the Vault path into a single K8s secret.
  # The Vault path must contain keys like:
  #   database_url, better_auth_secret, session_secret,
  #   keycloak_client_id, keycloak_client_secret,
  #   minio_root_user, minio_root_password, etc.
  dataFrom:
    - extract:
        key: {{ .Values.vault.path }}
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.vault.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.vault.secretStore }}
  target:
    creationPolicy: Owner
    deletionPolicy: {{ .Values.vault.deletionPolicy }}
    name: {{ include "bionic-org.name" . }}-secrets
