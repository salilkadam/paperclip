# Default values for bionic-org deployment.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# ---------------------------------------------------------------------------
# Namespace
# ---------------------------------------------------------------------------
namespace: bionicorg

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
image:
  repository: docker4zerocool/bionic
  tag: "40e3e904e"  # current production image (was 15ad899dd before the 2026-10-06 master-key incident)
  pullPolicy: Always

# Image pull secret (e.g. for Docker Hub rate-limit compliance)
imagePullSecret:
  enabled: true
  name: dockerhub-pull-secret

# ---------------------------------------------------------------------------
# Replicas
# ---------------------------------------------------------------------------
replicaCount: 1

# ---------------------------------------------------------------------------
# Domain / Ingress
# ---------------------------------------------------------------------------
domain: org.baisoln.com

ingress:
  className: kong
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    konghq.com/https-redirect-status-code: "301"
    konghq.com/preserve-host: "true"
    konghq.com/protocols: http,https
    konghq.com/strip-path: "false"
  tls:
    enabled: true
    secretName: bionic-org-tls

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  targetPort: 3100

# ---------------------------------------------------------------------------
# Resource limits
# NOTE: The bionic container hosts agent heartbeat runs, each of which spawns
# an adapter/CLI child process (~1Gi each). Waking several company agents at
# once OOMKilled the pod at the previous 2Gi limit, and again at 6Gi once two
# companies ran ~15 agents with 4-5 concurrent runs (measured ~7.2Gi steady,
# spiking higher on mass-wake). 16Gi is the OOM ceiling and MUST stay high
# because a mass-wake spikes memory in well under a second — neither HPA nor
# VPA can react that fast (both are poll-based: metrics-server scrape ~15s +
# HPA sync 15s; VPA recommender runs ~1min).
#
# The *request* (node reservation) is deliberately LOW (512Mi). A limit is a
# ceiling, not a reservation, so the 16Gi limit costs ~nothing when the org is
# calm; only the request is charged against the node. When the cluster has the
# VPA operator installed, the VerticalPodAutoscaler below auto-raises this
# request as real usage grows and lowers it again when calm (see `vpa`).
# ---------------------------------------------------------------------------
resources:
  limits:
    cpu: 2000m
    memory: 16Gi
  requests:
    cpu: 500m
    memory: 512Mi

# ---------------------------------------------------------------------------
# Vertical Pod Autoscaler (memory right-sizing)
# ---------------------------------------------------------------------------
# WHY VPA and not HPA: Paperclip is a single-writer control plane. Every
# replica runs its own heartbeat scheduler loop (server/src/index.ts
# startHeartbeatSchedulerInterval) with a PROCESS-LOCAL run-start lock
# (server/src/services/agent-start-lock.ts) and runs are pinned to the process
# that spawned them (server/src/services/heartbeat.ts:1387). So scaling OUT
# (HPA) is unsafe — it would run duplicate schedulers and never cuts per-pod
# memory anyway (an HPA scales replicas, not a pod's memory ceiling).
#
# WHAT THIS DOES: it manages the container's MEMORY REQUEST only
# (controlledValues: RequestsOnly), letting it grow as usage grows and shrink
# when calm — automating the manual "bump the memory" step. It leaves the
# 16Gi limit (the OOM ceiling) untouched so a burst still has headroom, and it does
# NOT manage CPU.
#
# updateMode InPlaceOrRecreate uses the v1.33 in-place resize feature to change
# the request WITHOUT evicting the pod; it only falls back to eviction if
# in-place is infeasible. NOTE: eviction would kill in-flight agent runs (they
# are process-pinned), so this is intentionally request-only + bounded.
# maxAllowed tracks the 16Gi OOM ceiling so the VPA cannot recommend above
# the limit.
#
# Requires the VPA operator CRD. This template renders ONLY when the CRD is
# present (see the capability guard in templates/vpa.yaml), so committing it is
# safe on clusters without the operator. Install the operator with
# deploy/scripts/setup-vpa-operator.sh, then `helm upgrade` to activate.
# Set enabled=false to opt out entirely.
# ---------------------------------------------------------------------------
vpa:
  enabled: true
  # Only tune memory; leave CPU to the static requests above.
  controlledResources:
    - memory
  controlledValues: RequestsOnly
  # cpu entries omitted on purpose: controlledResources is memory-only, so cpu
  # bounds here would be ignored by the recommender.
  minAllowed:
    memory: 512Mi
  maxAllowed:
    memory: 16Gi

# ---------------------------------------------------------------------------
# PostgreSQL (CNPG) — new database in existing pg-ceph cluster
# ---------------------------------------------------------------------------
postgresql:
  # The CNPG cluster this new DB belongs to
  cluster: pg-ceph
  namespace: pg
  # New database name to create
  database: bionicorg
  # New user name to create
  username: bionicorg
  # Password — generated if not provided (stored in Vault secret)
  password: ""
  # Connection will be formed as:
  #   postgresql://<username>:<password>@<primary-svc>.<pg-ns>.svc.cluster.local:5432/<database>
  primaryService: pg-ceph-rw
  port: 5432

# ---------------------------------------------------------------------------
# Persistence — CRITICAL: /paperclip holds the instance state
# (secrets/decision-signing.key, telemetry, local_disk storage, agent
# workspaces). Without a volume this lives on the container overlay and is
# destroyed on every pod recreation. In 2026-10-06 this silently lost the
# secrets master key before it was pinned via PAPERCLIP_SECRETS_MASTER_KEY.
# RWX (NFS) is deliberate: rolling updates never deadlock on attachment.
# ---------------------------------------------------------------------------
persistence:
  enabled: true
  name: bionic-org-data
  size: 20Gi
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  mountPath: /paperclip
  # App container runs as uid/gid 1000 (node)
  fsGroup: 1000

# ---------------------------------------------------------------------------
# Extra trusted root CAs
# ---------------------------------------------------------------------------
# The AgentMail mail plane serves TLS (IMAPS/SMTP/JMAP through the in-cluster
# agentmail-gw tunnel, dialed by the Loc-AgentMail connector) with a chain
# rooted at the "Paperclip AgentMail Internal CA", which is not a public root.
# Its PEM bundle ships as a ConfigMap in this namespace (applied out-of-band
# with the mail plane; the agentmail-gw tunnel pod mounts the same bundle).
# Node *adds* to — never replaces — its bundled roots via NODE_EXTRA_CA_CERTS,
# and the server forwards the variable to its scrubbed plugin-worker env
# (server/src/services/plugin-loader.ts, buildPluginWorkerEnv).
extraTrustedCa:
  enabled: true
  configMap: agentmail-ca
  key: agentmail-ca.crt
  mountDir: /ca

# ---------------------------------------------------------------------------
# Vault / ExternalSecrets
# ---------------------------------------------------------------------------
vault:
  # Vault server reachable from inside the cluster
  server: http://vault.vault.svc.cluster.local:8200
  # Vault JWT auth role used by External Secrets (see deploy/scripts/setup-vault-jwt.sh)
  jwtRole: eso-reader
  # KV v2 mount the ClusterSecretStore points at. This is the Vault MOUNT name
  # (not a folder): ESO builds read URLs as <kvMount>/data/<key>, and the
  # eso-reader policy only grants secret/data/* — putting a folder path here
  # 403s every sync (ExternalSecrets stay Ready=False and keep stale data).
  kvMount: secret
  # Vault path where app secrets are stored
  path: t6-apps/bionic-org/config
  # Key inside that path holding the Paperclip secrets master key
  # (base64 32-byte AES-256 key). MUST survive every redeploy — see
  # deploy/scripts/setup-vault-secrets.sh which generates it exactly once.
  masterKeySecretKey: paperclip_secrets_master_key
  # Shared org-wide provider API keys (Vault KV v2 path, e.g. anthropic_api_key,
  # claude_subscription_token, github_token, openai_api_key, ...). Synced into a
  # separate K8s secret so provider credentials live in exactly one place.
  apiKeysPath: shared/api-keys
  apiKeysSecretName: bionic-org-api-keys
  # Opt-in uppercase alias for the raw Anthropic API key. Claude Code/ACP auth
  # precedence checks ANTHROPIC_API_KEY BEFORE CLAUDE_CODE_OAUTH_TOKEN, so a
  # pod that carries ANTHROPIC_API_KEY makes every claude_local agent bill
  # prepaid API credits and silently ignores its Claude subscription login.
  # This org's Anthropic path is the subscription token
  # (claude_subscription_token), so the alias stays off. It was live by default
  # until the 2026-10-06 incident, when the credit-exhausted API key turned
  # every claude_local run into "Credit balance is too low" despite a healthy
  # ESO-synced subscription token. Only enable with --set
  # vault.anthropicApiKeyAlias=true if you intentionally switch to API-key
  # billing (the subscription token in the pod env is still overridden then).
  anthropicApiKeyAlias: false
  # Agent GitHub PAT (fine-grained, repo-scoped) stored in Vault at
  # t6-apps/bionic-org/config:sr_eng_agent_pat and ESO-extracted into the
  # <release>-secrets K8s secret (that path is already a whole-KV extract).
  # When enabled, GITHUB_TOKEN resolves from THIS secret instead of the
  # shared github_token key, and a host-scoped git credential helper is
  # registered via GIT_CONFIG_* so heartbeat children can `git push` to
  # github.com with nothing ever written to .git-credentials or HOME.
  # Lives inside the apiKeysPath env block, so it requires apiKeysPath set.
  agentGithubPat:
    enabled: false
    secretKey: sr_eng_agent_pat
  # Pod-wide MCP_API_KEY alias of shared/api-keys:mcp_api_key (already ESO-synced
  # into apiKeysSecretName). The central media skills
  # (skills/marketing-video-studio, skills/motion-explainer-studio) call the
  # self-hosted GPU stack at https://mcp.baisoln.com with X-API-Key: $MCP_API_KEY.
  # Lives inside the apiKeysPath env block, so it requires apiKeysPath set.
  mcpApiKeyAlias: true
  # Scoped media-bucket credentials for the video skills' asset upload/presign
  # (avatalk fetches inputs by presigned URL). Synced by ESO from Vault into a
  # dedicated K8s secret and exposed as MEDIA_S3_* env. Deliberately NOT the
  # MinIO root credentials.
  mediaS3:
    enabled: true
    path: t6-apps/voice-studio/config
    secretName: bionic-org-media-keys
    accessKeyProperty: minio_access_key
    secretKeyProperty: minio_secret_key
    bucketProperty: minio_bucket
    # Public S3 ingress: the only host both agents and avatalk can reach, so
    # presigned URLs work for both. Non-secret.
    endpoint: https://s3.baisoln.com
  # Secret store (ClusterSecretStore)
  secretStore: vault-backend
  # Refresh interval for ESO sync (JWT auth auto-mints tokens; 1h is plenty)
  refreshInterval: 1h
  # Deletion policy for the synced K8s secret
  deletionPolicy: Retain

# ---------------------------------------------------------------------------
# Keycloak
# ---------------------------------------------------------------------------
keycloak:
  # Internal URL of the Keycloak service
  internalUrl: http://keycloak.keycloak.svc.cluster.local:80
  url: https://auth.bionicaisolutions.com
  realm: Bionic
  # Client ID / secret — must be created in Keycloak and stored in Vault
  clientId: ""
  clientSecret: ""
  redirectUri: "https://org.baisoln.com/api/auth/callback"

# ---------------------------------------------------------------------------
# MinIO / S3 storage (optional — used if PAPERCLIP_STORAGE_PROVIDER=s3)
# ---------------------------------------------------------------------------
minio:
  endpoint: minio-tenant-hl.minio.svc.cluster.local:9000
  useSSL: "false"
  bucket: bionicorg
  rootUserSecret: ""      # synced from existing minio credentials
  rootPasswordSecret: ""   # synced from existing minio credentials

# ---------------------------------------------------------------------------
# Environment (non-secret, goes in ConfigMap)
# ---------------------------------------------------------------------------
env:
  # Ghost Blog plugin (paperclip.ghost-blog) reaches the company blogs in-cluster.
  # Format: "<pluginKey>=<host>[,<host>...]" entries separated by ";".
  PAPERCLIP_PLUGIN_HTTP_ALLOWED_PRIVATE_HOSTS: "paperclip.ghost-blog=ghost-bionic.blog.svc.cluster.local,ghost-reliora.blog.svc.cluster.local"
  # Server V8 heap ceiling. The container limit is 16Gi but the Dockerfile CMD
  # passes no --max-old-space-size, so V8 defaults to ~2.2GB and the server
  # (which legitimately runs ~1.3-2GB heap under live load) OOM-aborts on
  # spikes. Raise to leave several Gi for agent child processes sharing the
  # cgroup.
  NODE_OPTIONS: "--max-old-space-size=4096"
  NODE_ENV: production
  PAPERCLIP_DEPLOYMENT_MODE: authenticated
  PAPERCLIP_DEPLOYMENT_EXPOSURE: private
  PAPERCLIP_PUBLIC_URL: "https://{{ .Values.domain }}"
  PAPERCLIP_ALLOWED_HOSTNAMES: "{{ .Values.domain }}"
  PAPERCLIP_STORAGE_PROVIDER: local_disk  # or s3; set S3 env vars if s3
  # Escape hatch for hang-prone app-home storage (e.g. degraded NFS hard
  # mount): "1" skips the boot-time ownership probe/repair entirely.
  # PAPERCLIP_HOME_SCAN_TIMEOUT_SECONDS stays at the entrypoint's shell
  # default (120) unless set explicitly here.
  PAPERCLIP_SKIP_HOME_OWNERSHIP_SCAN: "0"
  PORT: "3100"
  SERVE_UI: "true"
  KEYCLOAK_REALM: "Bionic"
  KEYCLOAK_URL: "{{ .Values.keycloak.url }}"
  KEYCLOAK_INTERNAL_URL: "{{ .Values.keycloak.internalUrl }}"
  KEYCLOAK_REDIRECT_URI: "{{ .Values.keycloak.redirectUri }}"
  MINIO_ENDPOINT: "{{ .Values.minio.endpoint }}"
  MINIO_USE_SSL: "{{ .Values.minio.useSSL }}"
  MAIL_FROM: info@bionicaisolutions.com
  BIONIC_INTERNAL_BASE_URL: "https://org.baisoln.com"

# ---------------------------------------------------------------------------
# Central model access for every opencode_local agent, in every company.
# The platform, not each agent or each user, provides the model gateway:
#   - providers: the GPU-AI gateway definition. The key is the pod-wide
#     MCP_API_KEY (Vault shared/api-keys -> ESO), referenced as {env:...},
#     so no key value is stored here or in any agent.
#   - models: the models the deployment serves. New agents default to the
#     first entry and may only be created on a listed model (server mandate).
#   - agentDataRoot: each agent gets its own OpenCode data/state directory
#     under this root, so concurrent agents never share one SQLite database.
# An agent's own env still overrides these (board-only escape hatch).
# ---------------------------------------------------------------------------
modelAccess:
  enabled: true
  opencode:
    providers:
      gpuai:
        npm: "@ai-sdk/openai-compatible"
        name: "GPU-AI Gateway"
        options:
          baseURL: "https://mcp.baisoln.com/gpu-ai/v1"
          apiKey: "{env:MCP_API_KEY}"
        models:
          auto:
            name: "Auto router"
          qwen3.8-flash-next:
            name: "Qwen3.8 Flash Next"
    smallModel: "gpuai/qwen3.8-flash-next"
    models:
      - id: "gpuai/qwen3.8-flash-next"
        label: "Qwen3.8 Flash Next (GPU-AI)"
      - id: "gpuai/auto"
        label: "Auto router (GPU-AI)"
    agentDataRoot: /paperclip/agents

# ---------------------------------------------------------------------------
# Node/DNS config (mimics bionic-platform)
# ---------------------------------------------------------------------------
dnsConfig:
  options:
    - name: ndots
      value: "2"

# ---------------------------------------------------------------------------
# Liveness / Readiness probes
# ---------------------------------------------------------------------------
probes:
  # Gates liveness/readiness until the server first answers /health. Startup
  # time varies widely (entrypoint ownership repair on the NFS home, Composio
  # login, then heartbeat recovery): 23s to well over 85s observed. Without
  # this, liveness killed a still-starting server on every deploy. Budget:
  # failureThreshold x periodSeconds = 5 minutes.
  startup:
    path: /health
    port: 3100
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  liveness:
    path: /health
    port: 3100
    initialDelaySeconds: 15
    periodSeconds: 30
    # /health can exceed the 1s Kubernetes default while the event loop is
    # busy (recovery sweeps, large runs); that is slow, not dead.
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    port: 3100
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Pod annotations (e.g. force-pull)
# ---------------------------------------------------------------------------
podAnnotations: {}

# ---------------------------------------------------------------------------
# Service Account
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: bionic-org-sa
