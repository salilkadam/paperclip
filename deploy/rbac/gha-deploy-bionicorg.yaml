# RBAC for GitHub Actions deployments of bionic-org (ci-cd.yml).
#
# The runner authenticates with a long-lived token from this SA (stored as the
# K8S_DEPLOY_TOKEN repo secret). The wildcard Role below is namespaced to
# bionicorg only: helm must manage every object the chart renders
# (deployments, secrets incl. sh.helm.release.*, services, ingresses, and the
# cert-manager / external-secrets / VPA CRDs the built-in `admin` ClusterRole
# does not know about), but nothing outside this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gha-deploy-bionic
  namespace: bionicorg
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gha-deploy-bionic-helm
  namespace: bionicorg
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gha-deploy-bionic-helm
  namespace: bionicorg
subjects:
  - kind: ServiceAccount
    name: gha-deploy-bionic
    namespace: bionicorg
roleRef:
  kind: Role
  name: gha-deploy-bionic-helm
  apiGroup: rbac.authorization.k8s.io
---
# Long-lived static token for the SA (what K8S_DEPLOY_TOKEN holds).
apiVersion: v1
kind: Secret
metadata:
  name: gha-deploy-bionic.token
  namespace: bionicorg
  annotations:
    kubernetes.io/service-account.name: gha-deploy-bionic
type: kubernetes.io/service-account-token
---
# The chart renders two CLUSTER-scoped objects (Namespace/bionicorg and
# ClusterSecretStore/vault-backend); the namespaced `admin` RoleBinding above
# cannot touch those. This minimal ClusterRole grants exactly what helm needs
# to get/adopt/patch them (including during --atomic rollbacks).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gha-deploy-bionic-cluster
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["clustersecretstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gha-deploy-bionic-cluster
subjects:
  - kind: ServiceAccount
    name: gha-deploy-bionic
    namespace: bionicorg
roleRef:
  kind: ClusterRole
  name: gha-deploy-bionic-cluster
  apiGroup: rbac.authorization.k8s.io
